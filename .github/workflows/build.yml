name: Build

# Etiket (v2.0.0 gibi) push edildiginde veya elle (Actions sekmesi) tetiklendiginde
# Windows (portable .exe) ve Linux (.deb, .rpm, AppImage) paketlerini uretir.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build Windows portable
        run: npm run dist:win
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    # Resmi electron-builder imaji: deb/rpm/AppImage icin gereken tum araclar hazir.
    container:
      image: electronuserland/builder:latest
    strategy:
      fail-fast: false
      matrix:
        target: [deb, rpm, AppImage]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build Linux (${{ matrix.target }})
        run: npx electron-builder --linux ${{ matrix.target }}
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: [windows, linux]
    # Linux basarisiz olsa bile (windows varsa) release yine de yayinlanir.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List files
        run: ls -R artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
