<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>MateBook Kontrol — Bilgi Kartı</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #card {
    position: absolute; inset: 8px;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(20,20,26,.97), rgba(30,30,39,.97));
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
    color: #f2f2f5;
    font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
    opacity: 0; transform: translateY(14px) scale(.98);
    transition: opacity .18s ease, transform .18s ease;
  }
  #card.show { opacity: 1; transform: translateY(0) scale(1); }
  #icon {
    width: 46px; height: 46px; border-radius: 13px; flex: 0 0 auto;
    display: grid; place-items: center;
    background: #f5a623; color: #0b0b0f;
    font-size: 23px; font-weight: 800;
  }
  #txt { min-width: 0; }
  #title {
    font-size: 15px; font-weight: 700; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #sub {
    font-size: 12px; color: #a9a9b6; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="icon">⚙</div>
    <div id="txt">
      <div id="title">Mod değişti</div>
      <div id="sub"></div>
    </div>
  </div>
  <script>
    const card = document.getElementById('card');
    const icon = document.getElementById('icon');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    let hideT = null;
    window.__osd = function (d) {
      d = d || {};
      titleEl.textContent = d.title || '';
      subEl.textContent = d.subtitle || '';
      subEl.style.display = d.subtitle ? '' : 'none';
      icon.textContent = d.icon || '⚙';
      icon.style.background = d.accent || '#f5a623';
      card.classList.remove('show');
      void card.offsetWidth; // animasyonu yeniden tetikle
      card.classList.add('show');
      if (hideT) clearTimeout(hideT);
      hideT = setTimeout(() => card.classList.remove('show'), 2400);
    };
  </script>
</body>
</html>
